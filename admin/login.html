<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Control Room Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body admin-login-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>Owner Control Room</h2><p style="margin:8px 0 18px;color:var(--gray)">Secure server-side login. Credentials are never stored in the website.</p><input id="api" type="hidden"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><div style="display:flex;gap:8px;align-items:center"><input id="p" type="password" autocomplete="current-password" minlength="10" required style="flex:1"><label style="display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.8rem;color:var(--gray);cursor:pointer"><input id="show" type="checkbox" style="width:auto"> Show password</label></div></div><button class="btn btn-blue btn-full" style="margin-top:16px">Sign in</button><p id="m" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Forgot the owner credentials? Reset them server-side through the Apps Script Users system. Never put a password in website code.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
const api=document.getElementById("api"),u=document.getElementById("u"),p=document.getElementById("p"),show=document.getElementById("show"),m=document.getElementById("m");
api.value=window.PMT_PUBLIC_API_URL||localStorage.getItem("pmt-api-url")||"";
show.onchange=()=>p.type=show.checked?"text":"password";
const ROLE_DEFAULTS={Support:['dashboard','pos','billing','orders_view','repairs','customers','inventory_view'],Editor:['dashboard','website','banners','products_view','products_edit','media','feedback'],Manager:['dashboard','pos','billing','products_view','products_edit','inventory_view','inventory_edit','orders_view','orders_edit','repairs','coupons','customers','feedback','analytics','reports','media','website','banners'],Owner:['*']};
const LANDING={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};
function permissions(user){
  if(!user)return [];
  if(String(user.role)==='Owner')return ['*'];
  let x=user.permissions;
  if(typeof x==='string'){try{x=JSON.parse(x)}catch(_){x=[]}}
  return Array.isArray(x)&&x.length?x:(ROLE_DEFAULTS[String(user.role)]||[]);
}
function landing(user){const p=permissions(user);for(const n of Object.keys(LANDING)){if(p.includes('*')||p.includes(n))return LANDING[n]}return 'dashboard.html'}
document.getElementById("login").onsubmit=async e=>{
  e.preventDefault();m.textContent="Signing in…";
  if(!api.value)return m.textContent="Shop API is not configured.";
  try{
    const d=await Admin.request({action:"adminLogin",username:u.value.trim(),password:p.value});
    if(!d.token)throw Error(d.message||"Login failed");
    sessionStorage.setItem("pmt-admin-token",d.token);
    let user=d.user||{};
    try{const pd=await Admin.request({action:"myPermissions",token:d.token});if(pd&&pd.user)user=pd.user}catch(_){}
    sessionStorage.setItem("pmt-admin-user",JSON.stringify(user));
    location.replace(landing(user));
  }catch(x){m.textContent=x.message||"Login failed"}
};
</script></body></html>
