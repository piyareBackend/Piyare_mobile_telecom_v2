<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Piyare Mobile Telecom</title><meta id="metaDescription" name="description" content="Product details from Piyare Mobile Telecom."><link rel="stylesheet" href="assets/css/main.css"><style>.product-page{padding:55px 0}.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start}.main-photo{height:470px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.main-photo img{width:100%;height:100%;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.thumb{height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;padding:0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{outline:2px solid var(--blue)}.product-meta h1{font-size:2.25rem;margin-bottom:12px}.detail-price{font:700 1.45rem 'JetBrains Mono',monospace;margin:20px 0}.detail-description{color:var(--gray);white-space:pre-wrap;line-height:1.7;margin-bottom:24px}.buy-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.buy-row .qty{width:70px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}.not-found{text-align:center;padding:90px 20px}@media(max-width:800px){.product-layout{grid-template-columns:1fr}.main-photo{height:340px}.product-meta h1{font-size:1.8rem}}
</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark"><img src="assets/logo.png" alt="Piyare Mobile Telecom"></span> Piyare Mobile Telecom</a><div class="navlinks"><a href="repair.html">Repair</a><a href="shop.html">Shop</a><a href="coupons.html">Coupons</a><a href="track.html">Track</a><a href="contact.html">Contact</a></div><div class="navcart"><button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌙</button><button class="cart-btn" id="cartOpen">🛒<span class="cart-count" id="cartCount">0</span></button></div></nav></header><main class="product-page"><div class="wrap" id="root">Loading product…</div></main><footer><div class="wrap"><div class="foot-bottom">© 2026 Piyare Mobile Telecom. All rights reserved.</div></div></footer><div class="overlay" id="overlay"></div><div class="drawer" id="drawer"><div class="drawer-head"><h3>Your Cart</h3><button class="drawer-close" id="cartClose">✕</button></div><div class="drawer-body" id="cartBody"></div><div class="drawer-foot" id="cartFoot"></div></div><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/security.js"></script><script src="assets/js/analytics.js"></script><script src="assets/js/cart.js"></script><script>
(async function(){const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('root');try{const d=await pmtGet('publicProducts'),x=(d?.items||[]).find(v=>String(v.id)===String(id));if(!x)throw Error('Product not found');const imgs=Array.isArray(x.images)?x.images.slice(0,4):[];root.innerHTML=`<div style="margin-bottom:18px"><a href="shop.html">← Back to Shop</a></div><div class="product-layout"><div><div class="main-photo" id="mainPhoto"></div><div class="thumbs" id="thumbs"></div></div><div class="product-meta"><div class="section-tag">${escapeHtml(x.category||'Accessories')}</div><h1>${escapeHtml(x.name)}</h1><div class="detail-price">₹${Number(x.price||0)}</div><div class="detail-description">${escapeHtml(x.description||'Product details coming soon.')}</div><div class="buy-row"><input class="qty" id="qty" type="number" min="1" max="99" value="1"><button class="btn btn-primary" id="add">Add to Cart</button></div><p style="margin-top:15px;color:var(--gray)">${Number(x.stock||0)} in stock</p></div></div>`;const main=document.getElementById('mainPhoto'),thumbs=document.getElementById('thumbs');function show(i){const src=imgs[i];main.innerHTML=src?`<img src="${escapeHtml(pmtMediaUrl(src))}" alt="${escapeHtml(x.name)}" decoding="async">`:`<span style="font-size:5rem">${escapeHtml(x.icon||'📱')}</span>`;thumbs.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('active',j===i));}if(imgs.length){imgs.forEach((src,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=`<img src="${escapeHtml(pmtMediaUrl(src))}" alt="" loading="lazy" decoding="async">`;b.onclick=()=>show(i);thumbs.appendChild(b)});show(0);}else show(0);document.getElementById('add').onclick=()=>{const q=Math.max(1,Math.min(99,Number(document.getElementById('qty').value)||1));for(let i=0;i<q;i++)addToCart(String(x.id));};}catch(e){root.innerHTML='<div class="not-found"><h2>Product not found</h2><p>Unable to load this product right now.</p><a class="btn btn-blue" href="shop.html" style="margin-top:18px">Back to Shop</a></div>';}})();
</script></body></html>
