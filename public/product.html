<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Piyare Mobile Telecom</title><meta id="metaDescription" name="description" content="Product details from Piyare Mobile Telecom."><link rel="stylesheet" href="assets/css/main.css"><style>.product-page{padding:55px 0}.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start}.main-photo{height:470px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.main-photo img{width:100%;height:100%;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.thumb{height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;padding:0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{outline:2px solid var(--blue)}.product-meta .section-tag{margin-bottom:8px}.product-meta h1{font-size:2.25rem;margin-bottom:12px}.detail-price{font:700 1.45rem 'JetBrains Mono',monospace;margin:20px 0}.detail-description{color:var(--gray);white-space:pre-wrap;line-height:1.7;margin-bottom:24px}.buy-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.buy-row .qty{width:70px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}.variant-list{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.variant-btn{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer}.variant-btn.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(46,94,255,.15)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:34px}.detail-box{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface)}.detail-box h3{margin-bottom:10px}.spec-row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid var(--line)}.spec-row:last-child{border-bottom:0}.not-found{text-align:center;padding:90px 20px}.product-skeleton{display:grid;grid-template-columns:1fr 1fr;gap:42px}.product-skeleton .sk{background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:pmt-shimmer 1.2s infinite;border-radius:18px}.product-skeleton .photo{height:470px}.product-skeleton .copy{height:300px}@keyframes pmt-shimmer{to{background-position:-200% 0}}@media(max-width:800px){.product-layout,.product-skeleton{grid-template-columns:1fr}.main-photo{height:340px}.product-meta h1{font-size:1.8rem}.product-skeleton .photo{height:340px}.detail-grid{grid-template-columns:1fr}}
</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><span class="mark"><img src="assets/logo.png" alt="Piyare Mobile Telecom"></span> Piyare Mobile Telecom</a><div class="navlinks"><a href="repair.html">Repair</a><a href="shop.html">Shop</a><a href="coupons.html">Coupons</a><a href="track.html">Track</a><a href="contact.html">Contact</a></div><div class="navcart"><button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌙</button><button class="cart-btn" id="cartOpen">🛒<span class="cart-count" id="cartCount">0</span></button></div></nav></header><main class="product-page"><div class="wrap" id="root"><div class="product-skeleton"><div class="sk photo"></div><div class="sk copy"></div></div></div></main><section class="wrap" style="padding-bottom:55px"><div id="pmt-reviews" class="panel"></div></section><footer><div class="wrap"><div class="foot-bottom">© 2026 Piyare Mobile Telecom. All rights reserved.</div></div></footer><div class="overlay" id="overlay"></div><div class="drawer" id="drawer"><div class="drawer-head"><h3>Your Cart</h3><button class="drawer-close" id="cartClose">✕</button></div><div class="drawer-body" id="cartBody"></div><div class="drawer-foot" id="cartFoot"></div></div><a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener noreferrer">💬</a><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/security.js"></script><script src="assets/js/analytics.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/reviews.js"></script><script>
(function(){const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('root');function normalize(items){return (items||[]).map(v=>({id:String(v.id),name:v.name,cat:v.category||'Accessories',price:Number(v.price||0),icon:v.icon||'📱',stock:Number(v.stock||0),description:v.description||'',images:Array.isArray(v.images)?v.images:[],variants:Array.isArray(v.variants)?v.variants:[],specifications:Array.isArray(v.specifications)?v.specifications:[],compatibility:v.compatibility||'',whatsInBox:v.whatsInBox||'',seoTitle:v.seoTitle||v.name,seoDescription:v.seoDescription||v.description,mainImage:Number(v.mainImage||0)}));}function getCached(){try{return normalize(JSON.parse(localStorage.getItem('pmt-products-cache')||'[]'));}catch(_){return[]}}function render(x){if(!x)return;PRODUCTS=getCached();let selected=x.variants[0]||null;const imgs=(x.images&&x.images.length?x.images:[x.icon||'📱']).slice(0,4);root.innerHTML=`<div style="margin-bottom:18px"><a href="shop.html">← Back to Shop</a></div><div class="product-layout"><div><div class="main-photo" id="mainPhoto"></div><div class="thumbs" id="thumbs"></div></div><div class="product-meta"><div class="section-tag">${escapeHtml(x.cat)}</div><h1>${escapeHtml(x.name)}</h1><div class="detail-price" id="price">₹${Number(selected?.price||x.price)}</div>${x.variants.length?`<div><b>Choose variant</b><div class="variant-list" id="variantList">${x.variants.map((v,i)=>`<button type="button" class="variant-btn ${i===0?'active':''}" data-v="${escapeHtml(v.id)}">${escapeHtml(v.name)}${v.color?' · '+escapeHtml(v.color):''}</button>`).join('')}</div></div>`:''}<div class="detail-description">${escapeHtml(x.description||'Product details coming soon.')}</div><div class="buy-row"><input class="qty" id="qty" type="number" min="1" max="99" value="1"><button class="btn btn-primary" id="add">Add to Cart</button><a class="btn btn-outline" href="shop.html">Continue Shopping</a></div><p id="stock" style="margin-top:15px;color:var(--gray);font-size:.85rem"></p></div></div><div class="detail-grid"><section class="detail-box"><h3>Specifications</h3><div>${x.specifications.length?x.specifications.map(s=>typeof s==='string'?`<div class="spec-row"><span>${escapeHtml(s)}</span></div>`:`<div class="spec-row"><span>${escapeHtml(s.label||'')}</span><b>${escapeHtml(s.value||'')}</b></div>`).join(''):'<span style="color:var(--gray)">No specifications added yet.</span>'}</div></section><section class="detail-box"><h3>Compatibility</h3><div style="white-space:pre-wrap;color:var(--gray)">${escapeHtml(x.compatibility||'No compatibility information added yet.')}</div></section><section class="detail-box"><h3>What's in the box</h3><div style="white-space:pre-wrap;color:var(--gray)">${escapeHtml(x.whatsInBox||'No box contents added yet.')}</div></section><section class="detail-box"><h3>Product information</h3><div class="spec-row"><span>SKU</span><b>${escapeHtml(x.sku||'—')}</b></div><div class="spec-row"><span>Category</span><b>${escapeHtml(x.cat)}</b></div></section></div>`;document.title=x.seoTitle||x.name;document.getElementById('metaDescription').setAttribute('content',x.seoDescription||x.description||'Product details from Piyare Mobile Telecom.');const main=document.getElementById('mainPhoto'),thumbs=document.getElementById('thumbs');function show(i){const src=imgs[i];main.innerHTML=String(src).startsWith('http')?`<img src="${escapeHtml(src)}" alt="${escapeHtml(x.name)}" decoding="async">`:`<span style="font-size:5rem">${escapeHtml(src)}</span>`;thumbs.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('active',j===i));}imgs.forEach((src,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=String(src).startsWith('http')?`<img src="${escapeHtml(src)}" alt="" loading="lazy" decoding="async">`:`<span style="font-size:2rem">${escapeHtml(src)}</span>`;b.onclick=()=>show(i);thumbs.appendChild(b)});show(Math.min(x.mainImage,imgs.length-1));function refreshVariant(){const v=selected;document.getElementById('price').textContent='₹'+Number(v?.price||x.price);document.getElementById('stock').textContent=(v?Number(v.stock||0):Number(x.stock||0))+' in stock';document.querySelectorAll('.variant-btn').forEach(b=>b.classList.toggle('active',String(b.dataset.v)===String(v?.id)));}document.querySelectorAll('.variant-btn').forEach(b=>b.onclick=()=>{selected=x.variants.find(v=>String(v.id)===String(b.dataset.v))||null;refreshVariant()});document.getElementById('add').onclick=()=>{const q=Math.max(1,Math.min(99,Number(document.getElementById('qty').value)||1));for(let i=0;i<q;i++)addToCart(String(x.id),selected?String(selected.id):'')};refreshVariant();}const cached=getCached().find(v=>String(v.id)===String(id));if(cached)render(cached);pmtGet('publicProducts').then(d=>{const items=normalize(d.items||[]);if(items.length){localStorage.setItem('pmt-products-cache',JSON.stringify(items));const x=items.find(v=>String(v.id)===String(id));if(x)render(x);}}).catch(()=>{if(!cached)root.innerHTML='<div class="not-found"><h2>Product not found</h2><p>Unable to load this product right now.</p><a class="btn btn-blue" href="shop.html" style="margin-top:18px">Back to Shop</a></div>'});})();
</script></body></html>
