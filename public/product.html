(async function(){const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('root');try{if(!id)throw Error('Missing product id');const items=await pmtGetPublicProducts(),x=items.find(v=>String(v.id)===String(id));if(!x)throw Error('Product not found');window.PRODUCTS=[x];const imgs=Array.isArray(x.images)?x.images.filter(Boolean):[],variants=Array.isArray(x.variants)?x.variants:[],settings=x.imageSettings||{},frameHeight=Math.max(180,Math.min(700,Number(settings.height)||470)),fit=settings.fit||'contain',position=settings.position||'center',radius=Math.max(0,Math.min(40,Number(settings.radius)||18)),zoom=Math.max(.5,Math.min(1.8,Number(settings.zoom||100)/100)),bg=/^#[0-9a-f]{6}$/i.test(settings.background||'')?settings.background:'#f5f6fa';document.title=x.name+' — Piyare Mobile Telecom';document.getElementById('metaDescription').content=(x.description||('Buy '+x.name+' from Piyare Mobile Telecom.')).slice(0,155);document.getElementById('ogTitle').content=x.name+' — Piyare Mobile Telecom';document.getElementById('ogDescription').content=(x.description||'Mobile accessory from Piyare Mobile Telecom.').slice(0,200);document.getElementById('canonical').href=location.origin+location.pathname+'?id='+encodeURIComponent(x.id);const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:x.name,description:x.description||'',image:imgs.map(pmtMediaUrl),sku:String(x.id),category:x.category||'Accessories',offers:{'@type':'Offer',price:Number(x.price||0).toFixed(2),priceCurrency:'INR',availability:Number(x.stock||0)>0?'https://schema.org/InStock':'https://schema.org/OutOfStock',url:location.href}});document.head.appendChild(ld);root.innerHTML=`<div style="margin-bottom:18px"><a href="shop.html">← Back to Shop</a></div><div class="product-layout"><div><div class="main-photo" id="mainPhoto" style="height:${frameHeight}px;border-radius:${radius}px;background:${bg}"></div><div class="thumbs" id="thumbs"></div></div><div class="product-meta"><div class="section-tag">${escapeHtml(x.category||'Accessories')}</div><h1>${escapeHtml(x.name)}</h1><div class="detail-price" id="price">₹${Number(x.price||0)}</div><div id="variantBox" class="variants"></div><div class="detail-description">${escapeHtml(x.description||'Product details coming soon.')}</div><div class="buy-row"><input class="qty" id="qty" type="number" min="1" max="99" value="1"><button class="btn btn-primary" id="add">Add to Cart</button></div><p id="stock" style="margin-top:15px;color:var(--gray)"></p></div></div>`;const main=document.getElementById('mainPhoto'),thumbs=document.getElementById('thumbs'),price=document.getElementById('price'),stock=document.getElementById('stock'),variantBox=document.getElementById('variantBox');let selected=null;function show(i){const src=imgs[i];main.innerHTML=src?`<img src="${escapeHtml(pmtMediaUrl(src))}" alt="${escapeHtml(x.name)}" decoding="async" style="object-fit:${escapeHtml(fit)};object-position:${escapeHtml(position)};transform:scale(${zoom})">`:`<span style="font-size:5rem">${escapeHtml(x.icon||'📱')}</span>`;thumbs.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('active',j===i));}imgs.forEach((src,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=`<img src="${escapeHtml(pmtMediaUrl(src))}" alt="${escapeHtml(x.name)} image ${i+1}" loading="lazy" decoding="async">`;b.onclick=()=>show(i);thumbs.appendChild(b)});show(imgs.length?Math.max(0,Math.min(imgs.length-1,Number(x.mainImage||0))):0);variants.forEach(function(v){const b=document.createElement('button');b.type='button';b.className='variant';b.textContent=v.name+(v.color?' · '+v.color:'');b.onclick=function(){selected=v;variantBox.querySelectorAll('.variant').forEach(q=>q.classList.remove('active'));b.classList.add('active');price.textContent='₹'+Number(v.price||x.price||0);stock.textContent=Number(v.stock||0)+' in stock';if(v.image)main.innerHTML=`<img src="${escapeHtml(pmtMediaUrl(v.image))}" alt="${escapeHtml(v.name)}" style="object-fit:${escapeHtml(fit)};object-position:${escapeHtml(position)};transform:scale(${zoom})">`};variantBox.appendChild(b)});stock.textContent=Number(x.stock||0)+' in stock';document.getElementById('add').onclick=function(){const q=Math.max(1,Math.min(99,Number(document.getElementById('qty').value)||1));for(let i=0;i<q;i++)addToCart(String(x.id),selected?String(selected.id):'');};}catch(e){root.innerHTML='<div class="not-found"><h2>Product unavailable</h2><p>'+escapeHtml(e.message||'Unable to load this product right now.')+'</p><a class="btn btn-blue" href="shop.html" style="margin-top:18px">Back to Shop</a></div>';}})();
