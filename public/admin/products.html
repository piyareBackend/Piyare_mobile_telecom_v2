<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room — Products</title><link rel="stylesheet" href="../assets/css/main.css"></head>
<body class="admin-body">
<header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="banners.html">Banners</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Products</h1><p>Manage products without popup forms.</p><section class="cms-section"><div class="admin-actions"><a class="btn btn-blue" href="product-editor.html">＋ Add New Product</a><button class="btn" id="refresh" type="button">↻ Refresh</button></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Name/SKU</th><th>Price</th><th>Stock</th><th>Category</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main>
<script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script>
<script>
async function load(){try{if(window.Admin&&!Admin.auth()){location.replace('login.html');return;}const d=await pmtGet('products'),a=d?.items||[];rows.innerHTML=a.map(x=>`<tr><td>${escapeHtml(x.name)}<br><small>${escapeHtml(x.sku||x.id)}</small></td><td>₹${Number(x.price||0)}</td><td>${Number(x.stock||0)}</td><td>${escapeHtml(x.category||'Accessories')}</td><td><a class="btn" href="product-editor.html?id=${encodeURIComponent(x.id)}">Edit</a> <button class="btn" type="button" onclick="removeProduct('${String(x.id).replace(/'/g,"\\'")}','${String(x.name||'').replace(/'/g,"\\'")}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No records yet.</td></tr>';}catch(e){rows.innerHTML='<tr><td colspan="5">'+escapeHtml(e.message||'API request failed')+'</td></tr>';}}
async function removeProduct(id,name){if(!confirm('Delete “'+name+'”? This removes it from the product sheet.'))return;try{await pmtPost({action:'deleteProduct',payload:{id}});await load();}catch(e){alert(e.message||'Delete failed');}}
refresh.onclick=load;load();
</script></body></html>
