<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/admin/manifest.webmanifest"><title>PMT Admin Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>PMT Admin Login</h2><p style="margin:8px 0 18px;color:var(--gray)">Owner and staff use the same secure login portal. Your account permissions decide which modules are available.</p><input id="api" type="hidden" value="/api"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" minlength="10" required style="width:100%;box-sizing:border-box"></div><button type="submit" class="btn btn-blue btn-full" style="margin-top:16px" id="submit">Sign in</button><p id="m" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Access is controlled server-side. Staff cannot grant themselves permissions.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>api.value=window.PMT_PUBLIC_API_URL||'/api';localStorage.removeItem('pmt-api-url');document.getElementById('login').onsubmit=async e=>{e.preventDefault();m.textContent='Signing in…';submit.disabled=true;try{await Admin.login(u.value.trim(),p.value)}catch(x){m.textContent=x.message||'Login failed';submit.disabled=false}}</script></body></html>
