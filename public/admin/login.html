<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Control Room Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>Owner Control Room</h2><p style="margin:8px 0 18px;color:var(--gray)">Secure server-side login. Credentials are never stored in the website.</p><input id="api" type="hidden"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><div style="position:relative"><input id="p" type="password" autocomplete="current-password" minlength="10" required style="padding-right:76px;width:100%;box-sizing:border-box"><button type="button" id="show" class="btn btn-outline" style="position:absolute;right:5px;top:5px;padding:6px 10px;font-size:.78rem">Show</button></div></div><button class="btn btn-blue btn-full" style="margin-top:16px" id="submit">Sign in</button><p id="m" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Forgot the owner credentials? They must be reset in the Apps Script Users sheet or through the server-side recovery process. Do not put a password in website code.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>api.value=window.PMT_PUBLIC_API_URL||localStorage.getItem("pmt-api-url")||"";document.getElementById("show").onclick=()=>{p.type=p.type==="password"?"text":"password";show.textContent=p.type==="password"?"Show":"Hide"};document.getElementById("login").onsubmit=async e=>{e.preventDefault();m.textContent="Signing in…";submit.disabled=true;try{await Admin.login(u.value.trim(),p.value,api.value)}catch(x){m.textContent=x.message||"Login failed";submit.disabled=false}}</script></body></html>
