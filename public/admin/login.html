<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/admin/manifest.webmanifest"><title>PMT Admin Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>PMT Admin Login</h2><p style="margin:8px 0 18px;color:var(--gray)">Owner and staff use the same secure login portal. Your account permissions decide which modules are available.</p><input id="api" type="hidden" value="/api"><div class="field" style="margin-top:12px"><label for="u">Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" minlength="10" required style="width:100%;box-sizing:border-box"></div><button type="submit" class="btn btn-blue btn-full" style="margin-top:16px" id="submit">Sign in</button><p id="m" style="margin-top:12px"></p><p style="margin-top:14px;font-size:.78rem;color:var(--gray)">Access is controlled server-side. Staff cannot grant themselves permissions.</p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>
(function(){
  const ORDER=['dashboard','pos','billing','orders_view','repairs','customers','inventory_view','products_view','products_edit','website','banners','coupons','feedback','analytics','reports','media','settings','security','staff','backups'];
  const PAGE={dashboard:'dashboard.html',pos:'pos.html',billing:'billing.html',orders_view:'orders.html',repairs:'repairs.html',customers:'customers.html',inventory_view:'inventory.html',products_view:'products.html',products_edit:'product-editor-v2.html',website:'editor.html',banners:'banners.html',coupons:'coupons.html',feedback:'feedback.html',analytics:'analytics.html',reports:'reports.html',media:'media.html',settings:'settings.html',security:'security.html',staff:'staff-access.html',backups:'backup.html'};
  function perms(user){if(!user)return [];if(String(user.role)==='Owner')return ['*'];let p=user.permissions;if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){p=[]}}return Array.isArray(p)?p.map(String):[]}
  function landing(user){const p=perms(user);for(const n of ORDER)if(p.includes('*')||p.includes(n))return PAGE[n];return null}
  document.getElementById('login').onsubmit=async function(e){
    e.preventDefault();m.textContent='Signing in…';submit.disabled=true;
    try{
      const d=await Admin.request({action:'adminLogin',username:u.value.trim(),password:p.value});
      if(!d.token)throw Error(d.message||'Login failed');
      sessionStorage.setItem('pmt-admin-token',d.token);
      let user=d.user||{};
      try{const pd=await Admin.request({action:'myPermissions',token:d.token});if(pd&&pd.user)user=pd.user}catch(_){ }
      sessionStorage.setItem('pmt-admin-user',JSON.stringify(user));
      const target=landing(user);
      if(!target)throw Error('No admin modules are assigned to this account. Ask the owner to assign access.');
      location.replace(target);
    }catch(x){m.textContent=x.message||'Login failed';submit.disabled=false}
  };
})();
</script></body></html>
