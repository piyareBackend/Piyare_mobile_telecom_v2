<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Control Room Login</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><section style="min-height:100vh;display:grid;place-items:center"><form class="form-card" style="width:min(440px,92vw)" id="login"><h2>Owner Control Room</h2><p style="margin:8px 0 18px;color:var(--gray)">Secure server-side login. Credentials are never stored in the website.</p><input id="api" type="hidden"><div class="field" style="margin-top:12px"><label>Username</label><input id="u" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="p" type="password" autocomplete="current-password" minlength="10" required></div><button class="btn btn-blue btn-full" style="margin-top:16px">Sign in</button><p id="m" style="margin-top:12px"></p></form></section><script src="../assets/js/config.js"></script><script src="../assets/js/admin.js"></script><script>api.value=localStorage.getItem("pmt-api-url")||window.PMT_PUBLIC_API_URL||"";document.getElementById("login").onsubmit=e=>{e.preventDefault();if(!api.value)return m.textContent="Shop API is not configured.";Admin.login(u.value,p.value,api.value).catch(x=>m.textContent=x.message)}</script></body></html>
