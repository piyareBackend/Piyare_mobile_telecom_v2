<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details — PMT</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="orders.html">← Orders</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="customers.html">Customers</a><a href="reports.html">Monthly Reports</a></aside><main class="admin-main"><h1>Order Details</h1><div id="root" class="cms-section">Loading…</div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>const id=new URLSearchParams(location.search).get('id');async function load(){try{const d=await pmtGet('orderDetail',{id});if(!d?.order)throw Error(d?.message||'Order not found');const o=d.order;root.innerHTML=`<div class="kpi-grid"><div class="kpi">Customer<b>${escapeHtml(o.customer)}</b></div><div class="kpi">Status<b>${escapeHtml(o.status)}</b></div><div class="kpi">Total<b>₹${Number(o.total||0)}</b></div><div class="kpi">Payment<b>${escapeHtml(o.payment||'—')}</b></div></div><section class="cms-section" style="margin-top:18px"><h3>Order items</h3>${(o.items||[]).map(i=>`<div class="panel" style="margin-top:8px"><b>${escapeHtml(i.name||'Product')}</b>${i.variant?`<div>${escapeHtml(i.variant)}</div>`:''}<div style="color:var(--gray)">₹${Number(i.price||0)} × ${Number(i.qty||0)}</div></div>`).join('')||'<p>No items.</p>'}</section><p style="margin-top:18px;color:var(--gray)">Order ID: ${escapeHtml(o.id)} · ${escapeHtml(o.date||'')}</p>`}catch(e){root.textContent=e.message||'Could not load order.'}}load();</script></body></html>
