<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room — Monthly Reports</title><link rel="stylesheet" href="../assets/css/main.css"><style>@media print{.admin-top,.admin-sidebar,.report-controls{display:none!important}.admin-main{margin:0;padding:0}.cms-section{box-shadow:none!important;border:0!important}.print-only{display:block!important}}.print-only{display:none}</style></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="dashboard.html">← Dashboard</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="customers.html">Customers</a><a href="reports.html">Monthly Reports</a><a href="settings.html">Settings</a></aside><main class="admin-main"><h1>Monthly Reports</h1><p>Printable monthly business data.</p><section class="cms-section report-controls"><div class="form-row"><div class="field"><label>Month</label><input id="month" type="month"></div><div class="field" style="display:flex;align-items:end;gap:8px"><button class="btn btn-blue" id="load">Load Report</button><button class="btn" id="print">Print / Save PDF</button></div></div></section><div id="report"><section class="cms-section"><h2 id="title">Report</h2><div class="kpi-grid"><div class="kpi">Orders<b id="orders">—</b></div><div class="kpi">Repairs<b id="repairs">—</b></div><div class="kpi">Revenue<b id="revenue">—</b></div></div></section><section class="cms-section" style="margin-top:18px"><h2>Orders</h2><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div></section><section class="cms-section" style="margin-top:18px"><h2>Repairs</h2><div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Date</th><th>Name</th><th>Device</th><th>Status</th></tr></thead><tbody id="repairRows"></tbody></table></div></section></div><div class="print-only" id="printedAt"></div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>const now=new Date();month.value=now.toISOString().slice(0,7);async function load(){try{const d=await pmtGet('monthlyReport',{month:month.value});if(!d?.ok)throw Error(d?.message||'Report unavailable');title.textContent='Monthly Report — '+d.month;orders.textContent=d.summary.orders;repairs.textContent=d.summary.repairs;revenue.textContent='₹'+Number(d.summary.revenue||0);orderRows.innerHTML=(d.orders||[]).map(o=>`<tr><td>${escapeHtml(o.id)}</td><td>${escapeHtml(o.date||'')}</td><td>${escapeHtml(o.customer||'')}</td><td>₹${Number(o.total||0)}</td><td>${escapeHtml(o.status||'')}</td></tr>`).join('')||'<tr><td colspan="5">No orders.</td></tr>';repairRows.innerHTML=(d.repairs||[]).map(r=>`<tr><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.date||'')}</td><td>${escapeHtml(r.name||'')}</td><td>${escapeHtml(r.device||'')}</td><td>${escapeHtml(r.status||'')}</td></tr>`).join('')||'<tr><td colspan="5">No repairs.</td></tr>';printedAt.textContent='Generated: '+new Date().toLocaleString()}catch(e){title.textContent=e.message||'Could not load report.'}}load.onclick=load;print.onclick=()=>window.print();load();</script></body></html>
