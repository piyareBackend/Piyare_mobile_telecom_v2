<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Control Room — Reviews</title><link rel="stylesheet" href="../assets/css/main.css"></head><body>
<header class="admin-top"><b>PMT Control Room</b><a href="../index.html">Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="homepage.html">Homepage Blocks</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="reviews.html">Reviews</a><a href="feedback.html">Feedback</a><a href="notifications.html">Notifications</a><a href="alerts.html">Low Stock</a><a href="seo.html">SEO Manager</a><a href="media.html">Media</a><a href="backup.html">Backup / Restore</a><a href="users.html">Users & Roles</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Customer Reviews</h1><p>Approve, reject and feature customer reviews.</p><section class="cms-section"><div id="msg" style="margin-bottom:12px"></div><div id="list">Loading…</div></section>
<script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>
const list=document.getElementById('list'),msg=document.getElementById('msg');
async function act(id,status,featured){try{msg.textContent='Saving…';await pmtPost({action:'updateReview',payload:{id,status,featured:!!featured}});msg.textContent='Saved.';await load()}catch(e){msg.textContent=e.message||'Unable to save review.'}}
async function load(){try{const d=await pmtGet('reviews');const rows=d.reviews||[];list.innerHTML=rows.map(x=>`<div class="repeat-row"><b>${escapeHtml(x.name||'Customer')}</b> <span class="badge">${escapeHtml(x.status||'Pending')}</span>${x.productId?` <span class="badge">${escapeHtml(x.productId)}</span>`:''}<p>${escapeHtml(x.text||x.message||'')}</p><button class="btn" data-id="${escapeHtml(x.id||'')}" data-action="approve">Approve</button> <button class="btn" data-id="${escapeHtml(x.id||'')}" data-action="reject">Reject</button> <button class="btn" data-id="${escapeHtml(x.id||'')}" data-action="feature">Feature</button></div>`).join('')||'No reviews yet.';list.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.action;act(b.dataset.id,a==='approve'?'Approved':a==='reject'?'Rejected':String(rows.find(x=>String(x.id)===String(b.dataset.id))?.status||'Approved'),a==='feature')})}catch(e){list.textContent=e.message||'Unable to load reviews.'}}
load();
</script></main><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
