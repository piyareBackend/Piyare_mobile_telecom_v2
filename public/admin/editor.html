<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Editor — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><div class="admin-nav"><b>📱 PMT Admin</b><a href="dashboard.html">Dashboard</a><a href="editor.html">Page Editor</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="settings.html">Settings</a><a href="#" id="logout">Logout</a></div><main class="admin-wrap"><h1>Full Page Editor</h1><p style="color:var(--gray)">Edit business content, banners and gallery without changing executable code.</p><div id="msg"></div><div class="cms-grid"><section class="cms-section"><h3>Site / Contact / Local SEO</h3><div class="field"><label>Business Name</label><input id="site_name"></div><div class="field"><label>Tagline</label><input id="site_tagline"></div><div class="field"><label>WhatsApp Number</label><input id="site_whatsapp"></div><div class="field"><label>Address</label><input id="site_address"></div><div class="field"><label>Opening Hours</label><input id="site_hours"></div><div class="field"><label>City</label><input id="site_city"></div><div class="field"><label>State</label><input id="site_state"></div><div class="field"><label>PIN Code</label><input id="site_postalCode" inputmode="numeric" maxlength="6"></div><div class="field"><label>Business Categories</label><input id="site_categories"></div><div class="field"><label>Justdial Listing URL</label><input id="site_justdialUrl" type="url"></div></section><section class="cms-section"><h3>Home Hero</h3><div class="field"><label>Eyebrow</label><input id="home_eyebrow"></div><div class="field"><label>Title</label><input id="home_title"></div><div class="field"><label>Description</label><textarea id="home_description"></textarea></div><div class="field"><label>Primary Button</label><input id="home_primaryText"></div><div class="field"><label>Primary Link</label><input id="home_primaryLink"></div><div class="field"><label>Secondary Button</label><input id="home_secondaryText"></div><div class="field"><label>Secondary Link</label><input id="home_secondaryLink"></div></section><section class="cms-section"><h3>Trust Strip</h3><div id="trustEditor"></div></section><section class="cms-section"><h3>Footer</h3><div class="field"><label>Footer Description</label><textarea id="footer_description"></textarea></div></section></div><section class="cms-section" style="margin-top:18px"><h3>Banner Manager</h3><div id="bannerEditor"></div><button class="btn btn-blue" id="addBanner">＋ Add Banner</button></section><section class="cms-section" style="margin-top:18px"><h3>Shop Gallery</h3><div id="galleryEditor"></div><button class="btn btn-blue" id="addGallery">＋ Add Photo</button></section><div style="position:sticky;bottom:0;background:var(--surface);padding:15px 0;margin-top:18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="draft">💾 Save Draft</button><button class="btn btn-primary" id="publish">🚀 Publish Live</button><button class="btn" id="reset">Reset Local Draft</button><span id="publishedAt" style="align-self:center;color:var(--gray)"></span></div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/cms.js"></script><script src="../assets/js/admin.js"></script><script>
let content;const $=id=>document.getElementById(id);function field(id,val){$(id).value=val??""}function showPublished(){const t=content?.seo?.publishMeta?.publishedAt;$('publishedAt').textContent=t?'Last published: '+new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Not published yet';}function renderTrust(){$('trustEditor').innerHTML=(content.trust||[]).map((x,i)=>`<div class="repeat-row"><div class="form-row"><div class="field"><label>Icon</label><input data-t="icon" data-i="${i}" value="${escapeHtml(x.icon)}"></div><div class="field"><label>Title</label><input data-t="title" data-i="${i}" value="${escapeHtml(x.title)}"></div></div><div class="field"><label>Text</label><input data-t="text" data-i="${i}" value="${escapeHtml(x.text)}"></div></div>`).join('')}function renderBanners(){$('bannerEditor').innerHTML=(content.banners||[]).map((b,i)=>`<div class="repeat-row"><div class="form-row"><div class="field"><label>Title</label><input data-b="title" data-i="${i}" value="${escapeHtml(b.title)}"></div><div class="field"><label>Subtitle</label><input data-b="subtitle" data-i="${i}" value="${escapeHtml(b.subtitle)}"></div></div><div class="form-row"><div class="field"><label>Button</label><input data-b="button" data-i="${i}" value="${escapeHtml(b.button)}"></div><div class="field"><label>Link</label><input data-b="link" data-i="${i}" value="${escapeHtml(b.link)}"></div></div><div class="upload-box"><label>Banner Image</label><input type="file" accept="image/jpeg,image/png,image/webp" data-file="${i}"><input data-b="image" data-i="${i}" value="${escapeHtml(b.image||'')}" placeholder="Image URL after upload" style="margin-top:8px"></div><label style="display:block;margin-top:10px"><input type="checkbox" data-b="active" data-i="${i}" ${b.active!==false?'checked':''}> Active</label><button class="btn danger" style="margin-top:10px" data-remove="${i}">Delete Banner</button></div>`).join('');$('bannerEditor').querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{content.banners.splice(+x.dataset.remove,1);renderBanners()})}function renderGallery(){$('galleryEditor').innerHTML=(content.seo.gallery||[]).map((g,i)=>`<div class="repeat-row"><div class="form-row"><div class="field"><label>Caption</label><input data-g="caption" data-i="${i}" value="${escapeHtml(g.caption||'')}"></div><div class="field"><label>Image URL</label><input data-g="image" data-i="${i}" value="${escapeHtml(g.image||'')}"></div></div><input type="file" accept="image/jpeg,image/png,image/webp" data-gfile="${i}"><button class="btn danger" style="margin-top:10px" data-gremove="${i}">Delete Photo</button></div>`).join('');$('galleryEditor').querySelectorAll('[data-gremove]').forEach(x=>x.onclick=()=>{content.seo.gallery.splice(+x.dataset.gremove,1);renderGallery()})}function uploadFile(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>5*1024*1024)return reject(Error('Max image size is 5MB.'));const r=new FileReader();r.onload=async()=>{try{const d=await pmtPost({action:'uploadImage',filename:file.name,mime:file.type,base64:String(r.result).split(',')[1]});if(!d.url)throw Error(d.message||'Image upload failed');resolve(d.url)}catch(e){reject(e)}};r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(file);})}async function collect(){content.site={name:$('site_name').value.trim(),tagline:$('site_tagline').value.trim(),whatsapp:$('site_whatsapp').value.trim(),address:$('site_address').value.trim(),hours:$('site_hours').value.trim(),city:$('site_city').value.trim(),state:$('site_state').value.trim(),postalCode:$('site_postalCode').value.trim(),country:'IN',categories:$('site_categories').value.split(',').map(x=>x.trim()).filter(Boolean),justdialUrl:$('site_justdialUrl').value.trim()};content.home={eyebrow:$('home_eyebrow').value,title:$('home_title').value,description:$('home_description').value,primaryText:$('home_primaryText').value,primaryLink:$('home_primaryLink').value,secondaryText:$('home_secondaryText').value,secondaryLink:$('home_secondaryLink').value};content.footer=content.footer||{};content.footer.description=$('footer_description').value;document.querySelectorAll('[data-t]').forEach(x=>content.trust[+x.dataset.i][x.dataset.t]=x.value);document.querySelectorAll('[data-b]').forEach(x=>{const i=+x.dataset.i;content.banners[i][x.dataset.b]=x.type==='checkbox'?x.checked:x.value});for(const input of document.querySelectorAll('[data-file]'))if(input.files[0])content.banners[+input.dataset.file].image=await uploadFile(input.files[0]);for(const input of document.querySelectorAll('[data-g]')){const i=+input.dataset.i;content.seo.gallery[i][input.dataset.g]=input.value}for(const input of document.querySelectorAll('[data-gfile]'))if(input.files[0])content.seo.gallery[+input.dataset.gfile].image=await uploadFile(input.files[0]);}
async function start(){content=await pmtLoadFreshContent();content.site=content.site||{};content.home=content.home||{};content.footer=content.footer||{};content.seo=content.seo||{};content.seo.gallery=Array.isArray(content.seo.gallery)?content.seo.gallery:[];content.banners=Array.isArray(content.banners)?content.banners:[];field('site_name',content.site.name);field('site_tagline',content.site.tagline);field('site_whatsapp',content.site.whatsapp);field('site_address',content.site.address);field('site_hours',content.site.hours);field('site_city',content.site.city);field('site_state',content.site.state);field('site_postalCode',content.site.postalCode);field('site_categories',(content.site.categories||[]).join(', '));field('site_justdialUrl',content.site.justdialUrl);field('home_eyebrow',content.home.eyebrow);field('home_title',content.home.title);field('home_description',content.home.description);field('home_primaryText',content.home.primaryText);field('home_primaryLink',content.home.primaryLink);field('home_secondaryText',content.home.secondaryText);field('home_secondaryLink',content.home.secondaryLink);field('footer_description',content.footer.description);renderTrust();renderBanners();renderGallery();showPublished();}
$('addBanner').onclick=()=>{content.banners.push({id:'b'+Date.now(),title:'New Banner',subtitle:'',button:'Explore',link:'shop.html',image:'',active:true});renderBanners()};$('addGallery').onclick=()=>{content.seo.gallery.push({id:'g'+Date.now(),caption:'Piyare Mobile Telecom',image:''});renderGallery()};$('draft').onclick=async()=>{try{await collect();localStorage.setItem('pmt-cms-draft',JSON.stringify(content));$('msg').innerHTML='<div class="panel" style="margin:14px 0">Draft saved on this device. Live website was not changed.</div>'}catch(e){$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+escapeHtml(e.message)+'</div>'}};$('publish').onclick=async()=>{const btn=$('publish');btn.disabled=true;try{await collect();content.seo=content.seo||{};content.seo.publishMeta={publishedAt:new Date().toISOString(),publishedBy:(Admin.user()||{}).name||'Owner'};const d=await pmtPost({action:'saveContent',content});if(!d.ok)throw Error(d.message||'Publish failed');localStorage.setItem('pmt-content',JSON.stringify(content));localStorage.removeItem('pmt-cms-draft');localStorage.setItem('pmt-content-cache-v3',JSON.stringify({ts:Date.now(),content}));PMT_CONTENT_DATA=content;showPublished();window.dispatchEvent(new CustomEvent('pmt-content-updated'));$('msg').innerHTML='<div class="panel" style="margin:14px 0">Published live successfully.</div>'}catch(e){$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+escapeHtml(e.message)+'</div>'}finally{btn.disabled=false}};$('reset').onclick=()=>{localStorage.removeItem('pmt-cms-draft');location.reload()};$('logout').onclick=e=>{e.preventDefault();Admin.logout()};start().catch(e=>$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+escapeHtml(e.message)+'</div>');
</script></body></html>
