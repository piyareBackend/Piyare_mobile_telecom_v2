<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Access — Piyare Mobile Telecom</title><link rel="stylesheet" href="/assets/css/main.css"><script src="/assets/js/config.js"></script><script src="/assets/js/app.js"></script><style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px rgba(0,0,0,.04)}.staff{display:grid;grid-template-columns:260px 1fr;gap:18px}.users{display:flex;flex-direction:column;gap:8px}.user{border:1px solid #e5e7eb;border-radius:12px;padding:12px;cursor:pointer}.user.active{border-color:#111827}.muted{color:#6b7280;font-size:13px}.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.perm{border:1px solid #e5e7eb;border-radius:10px;padding:10px;display:flex;gap:9px;align-items:center}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:600}.primary{background:#111827;color:#fff}.secondary{background:#eef0f4;color:#111827}.status{min-height:20px;margin-top:10px;font-size:13px}@media(max-width:700px){.staff{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Staff Access Control</h1><div class="muted">Owner-only: choose exactly what each staff account can use.</div></div><a href="dashboard.html">Dashboard</a></div><section class="card staff"><aside><h3>Staff accounts</h3><div id="users" class="users">Loading…</div></aside><section><div id="selected"><h3>Select a staff member</h3><p class="muted">Permissions are capped by the staff member's role.</p></div></section></section></main><script>
(function(){const $=s=>document.querySelector(s);let users=[],selected=null,catalog={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderUsers(){const box=$('#users');box.innerHTML=users.length?users.map(u=>`<div class="user ${selected&&selected.id===u.id?'active':''}" data-id="${esc(u.id)}"><strong>${esc(u.name)}</strong><div class="muted">${esc(u.username)} · ${esc(u.role)} · ${esc(u.status)}</div></div>`).join(''):'No staff accounts found.';box.querySelectorAll('.user').forEach(x=>x.onclick=()=>{selected=users.find(u=>u.id===x.dataset.id);renderUsers();renderSelected();});}
function renderSelected(){const box=$('#selected');if(!selected){box.innerHTML='<h3>Select a staff member</h3><p class="muted">Permissions are capped by the staff member\'s role.</p>';return;}const allowed=new Set(selected.permissions||[]);const keys=Object.keys(catalog);box.innerHTML=`<h2>${esc(selected.name)}</h2><div class="muted">${esc(selected.username)} · Role: ${esc(selected.role)}</div><p>Unchecked permissions are blocked both in the admin UI and at the API.</p><div class="perms">${keys.map(k=>`<label class="perm"><input type="checkbox" data-perm="${esc(k)}" ${allowed.has(k)?'checked':''}> <span>${esc(catalog[k])}</span></label>`).join('')}</div><div class="actions"><button id="save" class="btn primary">Save permissions</button><button id="reset" class="btn secondary">Reset to role defaults</button></div><div id="status" class="status"></div>`;$('#save').onclick=save;$('#reset').onclick=reset;}
async function save(){const permissions=[...document.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm);const st=$('#status');st.textContent='Saving…';try{await pmtPost({action:'updateStaffPermissions',payload:{id:selected.id,permissions}});selected.permissions=permissions;users=users.map(u=>u.id===selected.id?selected:u);st.textContent='Permissions saved.';}catch(e){st.textContent=e.message||'Save failed.';}}
async function reset(){const role=selected.role;const defaults={Support:['dashboard','pos','billing','orders_view','repairs','customers','inventory_view'],Editor:['dashboard','website','banners','products_view','media','feedback'],Manager:['dashboard','pos','billing','products_view','products_edit','inventory_view','inventory_edit','orders_view','orders_edit','repairs','coupons','customers','feedback','analytics','reports','media','website','banners']}[role]||[];selected.permissions=defaults;renderSelected();}
async function load(){try{const d=await pmtGet('myPermissions');if(d?.user?.role!=='Owner'){location.replace('dashboard.html?access=denied');return;}catalog=d.user.permissionCatalog||{};const r=await pmtGet('users');users=r.data||[];selected=users[0]||null;renderUsers();renderSelected();}catch(e){document.body.innerHTML='<main class="wrap"><section class="card"><h2>Access unavailable</h2><p>'+esc(e.message||'Forbidden')+'</p></section></main>';}}
load();})();
</script></body></html>
