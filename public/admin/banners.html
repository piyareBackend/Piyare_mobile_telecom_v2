<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banner Manager — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="banners.html">Banners</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Banner Manager</h1><p>Create and manage the homepage hero banners. Upload directly here — no popup editor required.</p><div id="msg"></div><div id="bannerList"></div><button class="btn btn-blue" id="add">＋ Add Banner</button><button class="btn" id="save" style="margin-left:8px">💾 Save & Publish</button></main><script src="../assets/js/config.js"></script><script src="../assets/js/cms.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>
let content;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function render(){const a=content.banners||[];$('bannerList').innerHTML=a.map((b,i)=>`<section class="cms-section" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h3>Banner ${i+1}</h3><button class="btn danger" data-del="${i}">Delete</button></div><div class="form-row" style="margin-top:14px"><div class="field"><label>Title</label><input data-k="title" data-i="${i}" value="${esc(b.title)}"></div><div class="field"><label>Subtitle</label><input data-k="subtitle" data-i="${i}" value="${esc(b.subtitle)}"></div></div><div class="form-row"><div class="field"><label>Button text</label><input data-k="button" data-i="${i}" value="${esc(b.button)}"></div><div class="field"><label>Button link</label><input data-k="link" data-i="${i}" value="${esc(b.link)}"></div></div><div class="field"><label>Banner image</label><input type="file" accept="image/jpeg,image/png,image/webp" data-file="${i}"><small style="color:var(--gray)">JPG, PNG or WebP · max 5 MB</small><input data-k="image" data-i="${i}" value="${esc(b.image||'')}" placeholder="Uploaded image URL"></div><label style="display:block;margin-top:12px"><input type="checkbox" data-k="active" data-i="${i}" ${b.active!==false?'checked':''}> Show this banner</label>${b.image?`<img src="${esc(b.image)}" alt="Banner preview" style="margin-top:12px;width:100%;max-height:240px;object-fit:cover;border-radius:12px">`:''}</section>`).join('')||'<section class="cms-section">No banners yet. Add the first one.</section>';$('bannerList').querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{content.banners.splice(+x.dataset.del,1);render()})}
function add(){content.banners.push({id:'b'+Date.now(),title:'New Banner',subtitle:'',button:'Explore',link:'shop.html',image:'',active:true});render()}
async function upload(file){if(!file)return '';if(file.size>5*1024*1024)throw Error('Maximum image size is 5 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Only JPG, PNG and WebP are allowed.');const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const d=await pmtPost({action:'uploadImage',filename:file.name,mime:file.type,base64});return d.url}
async function save(){for(const x of document.querySelectorAll('[data-k]')){const i=+x.dataset.i;content.banners[i][x.dataset.k]=x.type==='checkbox'?x.checked:x.value}for(const x of document.querySelectorAll('[data-file]'))if(x.files[0])content.banners[+x.dataset.file].image=await upload(x.files[0]);await pmtPost({action:'saveContent',content});localStorage.setItem('pmt-content',JSON.stringify(content));$('msg').innerHTML='<div class="panel" style="margin:14px 0">Banners saved and published.</div>';render()}
$('add').onclick=add;$('save').onclick=()=>save().catch(e=>$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message)+'</div>');(async()=>{try{content=await loadSiteContent();content.banners=Array.isArray(content.banners)?content.banners:[];render()}catch(e){$('msg').textContent=e.message}})();
</script></body></html>
