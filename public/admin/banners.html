<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banner Manager — PMT Admin</title><link rel="stylesheet" href="../assets/css/main.css"><style>.banner-editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.banner-preview{position:relative;overflow:hidden;min-height:220px;border-radius:16px;display:flex;align-items:flex-end;padding:24px;background:var(--indigo);color:#fff}.banner-preview img,.banner-preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.banner-preview .shade{position:absolute;inset:0}.banner-preview .copy{position:relative;z-index:2}.banner-preview .preview-cta{display:inline-flex;margin-top:10px;position:relative;z-index:3}.hint{font-size:.75rem;color:var(--gray)}.control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:760px){.control-grid{grid-template-columns:1fr}}</style></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="banners.html">Banners</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="reports.html">Monthly Reports</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Hero & Banner Manager</h1><p>One source of truth for hero/banner media, placement, image fit and CTA overlay.</p><div id="msg"></div><div id="bannerList"></div><button class="btn btn-blue" id="add">＋ Add Banner</button><button class="btn" id="save" style="margin-left:8px">💾 Save & Publish</button></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/cms.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>let content;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function render(){const a=content.banners||[];$('bannerList').innerHTML=a.map((b,i)=>{const media=b.video||b.image;return `<section class="banner-editor"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Banner ${i+1}</h3><button class="btn danger" data-del="${i}">Delete</button></div><div class="form-row" style="margin-top:14px"><div class="field"><label>Title</label><input data-k="title" data-i="${i}" value="${esc(b.title)}"></div><div class="field"><label>Subtitle</label><input data-k="subtitle" data-i="${i}" value="${esc(b.subtitle)}"></div></div><div class="form-row"><div class="field"><label>Badge</label><input data-k="badge" data-i="${i}" value="${esc(b.badge||'Featured')}"></div><div class="field"><label>Button text</label><input data-k="button" data-i="${i}" value="${esc(b.button)}"></div></div><div class="form-row"><div class="field"><label>Button link</label><input data-k="link" data-i="${i}" value="${esc(b.link)}"></div><div class="field"><label>Placement</label><select data-k="placement" data-i="${i}"><option value="card" ${b.placement!=='hero'?'selected':''}>Repair/Warranty Card</option><option value="hero" ${b.placement==='hero'?'selected':''}>Full Hero Background</option></select></div></div><div class="control-grid"><div class="field"><label>Upload image/video</label><input type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" data-file="${i}"><span class="hint">JPG/PNG/WebP/MP4/WebM · max 5 MB</span></div><div class="field"><label>Media URL</label><input data-k="mediaUrl" data-i="${i}" value="${esc(media||'')}" placeholder="Optional direct URL"></div><div class="field"><label>Media type</label><select data-k="mediaType" data-i="${i}"><option value="image" ${!b.video?'selected':''}>Image</option><option value="video" ${b.video?'selected':''}>Video</option></select></div></div><div class="control-grid" style="margin-top:12px"><div class="field"><label>Fit</label><select data-k="fit" data-i="${i}"><option value="cover" ${!b.fit||b.fit==='cover'?'selected':''}>Cover</option><option value="contain" ${b.fit==='contain'?'selected':''}>Contain</option><option value="fill" ${b.fit==='fill'?'selected':''}>Fill</option></select></div><div class="field"><label>Position</label><select data-k="position" data-i="${i}"><option value="center" ${!b.position||b.position==='center'?'selected':''}>Center</option><option value="top" ${b.position==='top'?'selected':''}>Top</option><option value="center top" ${b.position==='center top'?'selected':''}>Center Top</option><option value="bottom" ${b.position==='bottom'?'selected':''}>Bottom</option><option value="left" ${b.position==='left'?'selected':''}>Left</option><option value="right" ${b.position==='right'?'selected':''}>Right</option></select></div><div class="field"><label>Blur: <output id="bo${i}">${Number(b.blur)||0}</output>px</label><input type="range" min="0" max="20" value="${Number(b.blur)||0}" data-k="blur" data-i="${i}" oninput="bo${i}.value=this.value"></div></div><div class="control-grid" style="margin-top:12px"><div class="field"><label>Height: <output id="ho${i}">${Number(b.height)||300}</output>px</label><input type="range" min="180" max="620" step="10" value="${Number(b.height)||300}" data-k="height" data-i="${i}" oninput="ho${i}.value=this.value"></div><div class="field"><label>Radius: <output id="ro${i}">${Number(b.radius)||16}</output>px</label><input type="range" min="0" max="40" value="${Number(b.radius)||16}" data-k="radius" data-i="${i}" oninput="ro${i}.value=this.value"></div><div class="field"><label>Overlay: <output id="oo${i}">${Math.round(Number(b.overlay??.45)*100)}</output>%</label><input type="range" min="0" max="1" step=".05" value="${Number(b.overlay??.45)}" data-k="overlay" data-i="${i}" oninput="oo${i}.value=Math.round(this.value*100)"></div></div><div class="control-grid" style="margin-top:12px"><div class="field"><label>Background color</label><input type="color" data-k="backgroundColor" data-i="${i}" value="${/^#[0-9a-f]{6}$/i.test(b.backgroundColor||'')?b.backgroundColor:'#1B1F3B'}"></div><div class="field"><label>Mobile height</label><input type="number" min="180" max="480" data-k="mobileHeight" data-i="${i}" value="${Number(b.mobileHeight)||260}"></div><label style="display:flex;align-items:center;gap:8px;margin-top:24px"><input type="checkbox" data-k="active" data-i="${i}" ${b.active!==false?'checked':''}> Show this banner</label></div>${media?`<div class="banner-preview" style="margin-top:16px;height:${Number(b.height)||300}px;border-radius:${Number(b.radius)||16}px;background:${esc(b.backgroundColor||'#1B1F3B')}"><div class="shade" style="opacity:${Number(b.overlay??.45)}"></div>${b.video?`<video src="${esc(media)}" muted autoplay loop playsinline></video>`:`<img src="${esc(media)}" alt="Banner preview" style="object-fit:${esc(b.fit||'cover')};object-position:${esc(b.position||'center')}">`}<div class="copy"><strong>${esc(b.title||'Banner preview')}</strong><div class="hint" style="color:#fff">${esc(b.subtitle||'')}</div>${b.button?`<a class="btn btn-primary preview-cta" href="${esc(b.link||'#')}">${esc(b.button)}</a>`:''}</div></div>`:''}</section>`}).join('')||'<section class="banner-editor">No banners yet. Add the first one.</section>';$('bannerList').querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{content.banners.splice(+x.dataset.del,1);render()})}function add(){content.banners.push({id:'b'+Date.now(),title:'New Banner',subtitle:'',badge:'Featured',button:'Explore',link:'shop.html',image:'',active:true,placement:'hero',fit:'cover',position:'center',blur:0,height:300,mobileHeight:260,radius:16,overlay:.45,backgroundColor:'#1B1F3B'});render()}async function upload(file){if(!file)return '';if(file.size>5*1024*1024)throw Error('Maximum media size is 5 MB.');const allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];if(!allowed.includes(file.type))throw Error('Use JPG, PNG, WebP, MP4 or WebM.');const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const d=await pmtPost({action:'uploadImage',filename:file.name,mime:file.type,base64});if(!d.url)throw Error(d.message||'Upload failed');return d.url}async function save(){const btn=$('save');btn.disabled=true;btn.textContent='Publishing…';try{for(const x of document.querySelectorAll('[data-k]')){const i=+x.dataset.i;let v=x.type==='checkbox'?x.checked:x.value;if(['blur','height','radius','mobileHeight'].includes(x.dataset.k))v=Number(v);if(x.dataset.k==='overlay')v=Number(v);if(x.dataset.k==='mediaUrl'){const type=content.banners[i].mediaType||'image';delete content.banners[i].image;delete content.banners[i].video;content.banners[i][type==='video'?'video':'image']=v}else content.banners[i][x.dataset.k]=v}for(const x of document.querySelectorAll('[data-file]'))if(x.files[0]){const url=await upload(x.files[0]),i=+x.dataset.file,type=content.banners[i].mediaType||'image';delete content.banners[i].image;delete content.banners[i].video;content.banners[i][type==='video'?'video':'image']=url}const d=await pmtPost({action:'saveContent',content});if(!d.ok)throw Error(d.message||'Publish failed');localStorage.setItem('pmt-content',JSON.stringify(content));localStorage.setItem('pmt-content-cache-v3',JSON.stringify({ts:Date.now(),content}));window.dispatchEvent(new CustomEvent('pmt-content-updated'));$('msg').innerHTML='<div class="panel" style="margin:14px 0">Banner settings saved and published.</div>';render()}catch(e){$('msg').innerHTML='<div class="panel" style="margin:14px 0;color:var(--red)">'+esc(e.message||'Publish failed')+'</div>'}finally{btn.disabled=false;btn.textContent='💾 Save & Publish'}}$('add').onclick=add;$('save').onclick=save;(async()=>{try{content=await pmtLoadFreshContent();content.banners=Array.isArray(content.banners)?content.banners:[];render()}catch(e){$('msg').textContent=e.message||'Unable to load banners'}})();</script></body></html>
