<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Profile — PMT</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Owner Control Room</b><a href="customers.html">← Customers</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="customers.html">Customers</a><a href="reports.html">Monthly Reports</a></aside><main class="admin-main"><h1>Customer Profile</h1><div id="root">Loading…</div></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>const id=new URLSearchParams(location.search).get('id');async function load(){try{const d=await pmtGet('customerDetail',{id});if(!d?.customer)throw Error(d?.message||'Customer not found');const c=d.customer;root.innerHTML=`<section class="cms-section"><div class="kpi-grid"><div class="kpi">Name<b>${escapeHtml(c.name)}</b></div><div class="kpi">Phone<b>${escapeHtml(c.phoneMasked)}</b></div><div class="kpi">Orders<b>${Number(c.orders||0)}</b></div><div class="kpi">Last activity<b>${escapeHtml(c.lastActivity||'—')}</b></div></div></section><section class="cms-section" style="margin-top:18px"><h2>Order history</h2>${(d.orders||[]).map(o=>`<div class="panel" style="margin-top:8px"><a href="order-detail.html?id=${encodeURIComponent(o.id)}"><b>${escapeHtml(o.id)}</b></a><div>${escapeHtml(o.date||'')} · ${escapeHtml(o.status||'Pending')} · ₹${Number(o.total||0)}</div></div>`).join('')||'<p>No orders yet.</p>'}</section><section class="cms-section" style="margin-top:18px"><h2>Repair history</h2>${(d.repairs||[]).map(r=>`<div class="panel" style="margin-top:8px"><b>${escapeHtml(r.id)}</b><div>${escapeHtml(r.date||'')} · ${escapeHtml(r.device||'')} · ${escapeHtml(r.status||'Pending')}</div><div style="color:var(--gray)">${escapeHtml(r.issue||'')}</div></div>`).join('')||'<p>No repairs yet.</p>'}</section>`}catch(e){root.textContent=e.message||'Could not load customer.'}}load();</script></body></html>
